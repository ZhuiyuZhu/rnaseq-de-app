name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate synthetic validation data
        run: python scripts/make_test_data.py --out data --reads 4000 --seed 7
      - name: Run pipeline
        run: >
          python run_pipeline.py
          --fastq-dir data/fastq
          --samplesheet data/samplesheet.csv
          --transcriptome data/ref/transcriptome.fa
          --outdir results_ci
          --de-backend ttest
      - name: Validate against ground truth
        run: python scripts/validate_results.py results_ci/de/de_results.csv data/ground_truth.json
      - name: Pytest
        run: pytest -q
